name: Supabase Keep Alive

on:
  schedule:
    # Ping setiap 3 hari sekali pada jam 00:00 UTC
    # Supabase pauses project setelah 7 hari tidak aktif (free tier)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Bisa dijalankan manual dari GitHub Actions

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive API
        run: |
          echo "🔄 Mengirim ping ke keep-alive endpoint..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/keep-alive" \
            -H "x-keep-alive-secret: ${{ secrets.KEEP_ALIVE_SECRET }}")
          
          echo "✅ HTTP Status: $RESPONSE"
          
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Ping gagal! Status: $RESPONSE"
            exit 1
          fi
          
          echo "🎉 Supabase berhasil di-ping. Database tetap aktif!"
